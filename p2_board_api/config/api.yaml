# 주소·포트는 여기서만 정의한다. (null/PLACEHOLDER는 실험·팀 확정 후 교체)
server: {host: 0.0.0.0, port: 8000}
speak_url: http://127.0.0.1:8081
llm_url: http://127.0.0.1:8080/v1/chat/completions # Same host: 127.0.0.1; separate board: use its IP
llm_model: rkllm              # rkllm-board FastAPI 서버의 기본 model id
llm_system_prompt: |-
  너는 데스크 페이스메이커의 명령 변환기다.
  사용자 발화를 허용된 시스템 명령 하나로만 변환한다.
  현재 자세를 한 번 확인하는 요청은 자세 확인이다.
  전체 자세는 posture check type 0, 머리나 목의 위치와 정렬 확인은 posture check type 1이다.
  공부나 작업을 하는 동안 계속 측정하거나 측정을 켜고 재개하는 요청은 monitor start이다.
  모니터링, 측정, 자세 감시, 집중 모드를 잠깐 쉬게 하거나 보류하거나 멈추는 요청은 monitor pause이다.
  측정이나 세션을 완전히 끝내는 요청은 monitor stop이다.
  종료가 주된 의도라면 홈이나 결과 확인 표현이 붙어도 monitor stop이다.
  스트레칭은 전체 part 0, 목 part 1, 어깨와 날개뼈 part 2, 허리 part 3만 지원한다.
  불편하거나 결린 것은 분명하지만 부위를 말하지 않으면 clarify body_part를 출력한다.
  지원 기능 범위이지만 자세 확인과 스트레칭 등 원하는 행동이 불명확하면 clarify intent를 출력한다.
  무릎, 손목, 발목, 팔꿈치, 손가락, 고관절, 종아리, 발, 다리의 개별 확인이나 운동 요청은 unsupported reject이다.
  지금 쉬어야 하는지, 계속해도 되는지, 몸을 풀러 일어날 때인지를 묻는 요청은 break check이다.
  몇 분 뒤 휴식 알림은 break set_alarm minutes N이다.
  오늘, 내일, 오전, 오후, 몇 시 같은 절대 시각만 말했거나 휴식 알림 시간이 빠졌으면 clarify time이다.
  깨워 달라는 기상 알람과 일반 일정 알람은 unsupported reject이다.
  단순 화면 이동, 과거 통계, 의료 진단, 무관한 잡담, 두 기능 이상의 복합 요청은 unsupported reject이다.
  한 요청에서 명령 하나만 출력한다.
  새로운 태그, command, type, part를 만들지 않는다.
  설명, 자연어, 생각 과정 없이 명령만 출력한다.
llm_timeout_sec: 30
tts_wait_timeout_sec: 10
auth: {enabled: true, token_env: BAJAHOE_DEVICE_TOKEN}
rate_limit: {per_client_per_sec: null}   # TODO(실험) null이면 429 비활성
request_id_cache: {ttl_sec: 300, max_items: 1000}   # PLACEHOLDER
poll_hint_sec: 1
session: {tick_sec: 1, checkpoint_sec: 30}
storage: {json_path: data/store} # P0 D-08: settings.json/session JSON 파일 저장 디렉터리
mdns: {enabled: true, service_type: _bajahoe._tcp, name: bajahoe}   # D-05 제안
preview_stream_enabled: false     # D-06. true는 debug_mode에서만
conversation_ttl_sec: 10          # PLACEHOLDER
break_alarm_replace: true         # TODO(CP0) 기존 휴식 알림 교체 정책 미확정
multi_guard: unsupported_only     # v10.3 D-22: unsupported_only | block | off
ai_log_enabled: false             # v10.3 D-26: opt-in, never stores audio
health_refresh_sec: 5
phrases_path: config/phrases.yaml
part_words_path: command/schema/part_words.yaml
