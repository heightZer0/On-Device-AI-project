"0":
  title: "전체 스트레칭"
  steps: ["의자에 편히 앉아 어깨 힘을 빼 보세요.", "목, 어깨, 허리 순서로 천천히 풀어 볼게요."]
"1":
  title: "목 스트레칭"
  steps: ["턱을 살짝 당기고 5초 정도 유지해 보세요.", "고개를 천천히 좌우로 돌려 보세요. 불편하면 멈춰 주세요."]
"2":
  title: "어깨 스트레칭"
  steps: ["어깨를 위로 으쓱했다가 천천히 내려 보세요.", "어깨를 뒤로 크게 돌려 보세요."]
"3":
  title: "허리 스트레칭"
  steps: ["등받이에서 등을 떼고 허리를 곧게 펴 보세요.", "두 손을 깍지 끼고 위로 쭉 뻗어 보세요."]
