version: 10.3
require_suda_end: true
functions:
  posture:
    commands:
      check:
        required: [type]
        params:
          type: {values: ["0", "1"], disabled: ["2"]}
        prereq: [calibrated, monitoring, not_unavailable]
  monitor:
    commands:
      start: {params: {}, prereq: [camera_ready, calibrated]}
      pause: {params: {}, prereq: [monitoring]}
      stop: {params: {}, prereq: [session]}
  stretch:
    commands:
      recommend:
        required: [part]
        params:
          part: {values: ["0", "1", "2", "3"]}
        on_missing: clarify
  clarify:
    commands:
      body_part: {params: {}}
      intent: {params: {}}
      time: {params: {}}
  sitting:
    commands:
      time: {params: {}, prereq: [session]}
  break:
    commands:
      check: {params: {}, prereq: [session]}
      set_alarm:
        required: [minutes]
        params:
          minutes: {type: int, literal: "N"}
  unsupported:
    commands:
      reject: {params: {}}
part_labels: {"0": 전체, "1": 목, "2": 어깨, "3": 허리}
type_labels: {"0": 전체(현재 H 기준), "1": 머리 상대 위치}
