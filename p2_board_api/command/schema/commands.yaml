version: 10.2
require_suda_end: false
functions:
  posture:
    commands:
      check:
        required: [type]
        params:
          type: {values: ["0", "1"], disabled: ["2"]}
        prereq: [calibrated, monitoring, not_unavailable]
  monitor:
    commands:
      start: {params: {}, prereq: [calibrated]}
      pause: {params: {}, prereq: []}
      stop: {params: {}, prereq: []}
  stretch:
    commands:
      recommend:
        required: [part]
        params:
          part: {values: ["0", "1", "2", "3"]}
        on_missing: clarify
  clarify:
    commands:
      body_part: {params: {}}
  sitting:
    commands:
      time: {params: {}, prereq: [session_or_last]}
  break:
    commands:
      check: {params: {}, prereq: [session_or_last]}
      set_alarm:
        required: [minutes]
        params:
          minutes: {type: int, min: 1, max: 180}
part_labels: {"0": 전체, "1": 목, "2": 어깨, "3": 허리}
type_labels: {"0": 전체(현재 H 기준), "1": 머리 상대 위치}
